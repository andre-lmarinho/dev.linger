name: devlinger
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver

maintainer: DevLinger contributors
description: Monitor and stop local development services from the Linux system tray
homepage: ${REPO_URL}
license: MIT

contents:
  - src: dist/devlinger
    dst: /usr/bin/devlinger
    file_info:
      mode: 0755

  - src: dist/assets/usr/share/applications/${APPID}.desktop
    dst: /usr/share/applications/${APPID}.desktop
    expand: true

  - src: dist/assets/usr/share/applications/${APPID}.desktop
    dst: /etc/xdg/autostart/${APPID}.desktop
    expand: true

  - src: dist/assets/usr/share/metainfo/${APPID}.metainfo.xml
    dst: /usr/share/metainfo/${APPID}.metainfo.xml
    expand: true

  - src: dist/assets/usr/share/icons/hicolor/scalable/apps/${APPID}.svg
    dst: /usr/share/icons/hicolor/scalable/apps/${APPID}.svg
    expand: true

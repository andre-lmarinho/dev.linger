<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">DevLinger</title>
  <desc id="desc">Ícone do DevLinger, monitor de serviços locais no tray do Linux.</desc>

  <!-- fundo -->
  <rect x="16" y="20" width="96" height="88" rx="16" fill="#ff3eb9"/>

  <!-- header / status -->
  <circle cx="34" cy="38" r="4" fill="#ffffff" opacity="0.95"/>
  <circle cx="46" cy="38" r="4" fill="#ffffff" opacity="0.75"/>
  <circle cx="58" cy="38" r="4" fill="#ffffff" opacity="0.55"/>

  <!-- linhas centrais, inspiradas no tray icon -->
  <rect x="34" y="52" width="60" height="10" rx="5" fill="#ffffff"/>
  <rect x="34" y="70" width="44" height="10" rx="5" fill="#ffffff"/>

  <!-- indicador de atividade -->
  <rect x="84" y="70" width="10" height="10" rx="5" fill="#ffffff" opacity="0.9"/>
</svg>